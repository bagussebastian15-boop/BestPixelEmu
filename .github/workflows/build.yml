name: build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Unduh core libretro
        # Dibuat mandiri (tidak butuh scripts/fetch_cores.sh di repo)
        run: |
          set -euo pipefail
          BASE="https://buildbot.libretro.com/nightly/android/latest"
          CORES="mgba snes9x genesis_plus_gx mame2010 fbneo"
          ABIS="arm64-v8a armeabi-v7a"   # tambahkan x86 x86_64 bila perlu
          TMP="$(mktemp -d)"
          for abi in $ABIS; do
            mkdir -p "app/src/main/jniLibs/$abi"
            for core in $CORES; do
              target="app/src/main/jniLibs/$abi/lib${core}_libretro_android.so"
              url="$BASE/$abi/${core}_libretro_android.so.zip"
              echo "-> $url"
              ok=0
              for try in 1 2 3 4 5 6; do
                if curl -fsSL --http1.1 --connect-timeout 20 --max-time 180 -A "Mozilla/5.0 fetch_cores" "$url" -o "$TMP/$core.zip"; then ok=1; break; fi
                echo "   gagal (percobaan $try/6), ulangi..."; sleep $((try * 5))
              done
              [ "$ok" = 1 ] || { echo "::error::Gagal mengunduh $url"; exit 1; }
              rm -rf "$TMP/x" && mkdir -p "$TMP/x"
              unzip -oq "$TMP/$core.zip" -d "$TMP/x"
              mv -f "$TMP/x/${core}_libretro_android.so" "$target"
              sleep 1
            done
          done

      - name: Pastikan core arcade (MAME 2010 + FBNeo) ada
        run: |
          ls -l app/src/main/jniLibs/*/
          for abi in arm64-v8a armeabi-v7a; do
            for core in mame2010 fbneo; do
              test -s "app/src/main/jniLibs/$abi/lib${core}_libretro_android.so" \
                || { echo "::error::Core $core untuk $abi tidak ada"; exit 1; }
            done
          done

      - name: Build APK debug
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 1
