name: build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Unduh core libretro
        env:
          # ABI yang disertakan di APK (hapus baris ini untuk semua ABI: armeabi-v7a arm64-v8a x86 x86_64)
          ABIS: "arm64-v8a armeabi-v7a"
          # Selalu unduh ulang core ini agar memakai build nightly terbaru
          REFRESH: "fbneo mame2010"
        run: bash scripts/fetch_cores.sh

      - name: Pastikan core arcade (MAME 2010 + FBNeo) ada
        run: |
          ls -l app/src/main/jniLibs/*/
          for abi in arm64-v8a armeabi-v7a; do
            for core in mame2010 fbneo; do
              test -s "app/src/main/jniLibs/$abi/lib${core}_libretro_android.so" \
                || { echo "::error::Core $core untuk $abi tidak ada"; exit 1; }
            done
          done

      - name: Build APK debug
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 1
