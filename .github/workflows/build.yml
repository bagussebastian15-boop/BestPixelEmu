name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }

      - name: Unduh core libretro (arm64)
        run: |
          D=app/src/main/jniLibs/arm64-v8a
          mkdir -p $D
          for c in mgba genesis_plus_gx snes9x fbneo; do
            curl -fsSL "https://buildbot.libretro.com/nightly/android/latest/arm64-v8a/${c}_libretro_android.so.zip" -o /tmp/$c.zip
            unzip -o /tmp/$c.zip -d /tmp/$c
            cp /tmp/$c/${c}_libretro_android.so $D/lib${c}_libretro_android.so
          done

      - run: gradle :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: allinone-debug-apk
          path: app/build/outputs/apk/debug/*.apk
